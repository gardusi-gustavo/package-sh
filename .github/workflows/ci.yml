name: ci
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  ci:
    uses: gardusi-gustavo/workflow-devops/.github/workflows/ci-shell.yml@v0.1.0
    with:
      command: |
        for f in $(git ls-files '*.sh'); do bash -n "$f"; done
        bash -n bin/sb
